name: Build OrangeFox

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox branch (12.1 hoac 14.1)'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 14.1

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
    timeout-minutes: 180
    env:
      USE_CCACHE: 1
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPRESS: 1
    steps:
    - name: Free disk space (manual cleanup, no 3rd-party action)
      continue-on-error: true
      timeout-minutes: 10
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/lib/google-cloud-sdk
        sudo rm -rf /usr/share/miniconda
        sudo rm -rf /usr/local/lib/node_modules
        sudo rm -rf /usr/share/az_11 /usr/share/az_12
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/go
        sudo rm -rf /var/lib/docker || true
        sudo apt-get clean -y || true
        df -h / | tail -1

    - name: Cache ccache (compile cache)
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('device/xiaomi/selene/BoardConfig.mk', 'device/xiaomi/selene/device.mk') }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ hashFiles('device/xiaomi/selene/BoardConfig.mk', 'device/xiaomi/selene/device.mk') }}-
          ccache-${{ runner.os }}-

    - name: Cache OrangeFox source (synced tree)
      uses: actions/cache@v4
      with:
        path: |
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/frameworks
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/system
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/hardware
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/bootable
        key: orangefox-source-${{ runner.os }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.sha }}
        restore-keys: |
          orangefox-source-${{ runner.os }}-${{ github.event.inputs.MANIFEST_BRANCH }}-
          orangefox-source-${{ runner.os }}-

    - name: Cache device/vendor trees
      uses: actions/cache@v4
      with:
        path: |
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/device/xiaomi/selene
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/vendor/xiaomi/selene
        key: device-vendor-${{ runner.os }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ hashFiles('OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/device/xiaomi/selene/**', 'OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/vendor/xiaomi/selene/**') }}
        restore-keys: |
          device-vendor-${{ runner.os }}-${{ github.event.inputs.MANIFEST_BRANCH }}-
          device-vendor-${{ runner.os }}-

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment
      timeout-minutes: 20
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Sync OrangeFox sources (wiki orangefox_sync.sh)
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Place device tree (Orange-Fox) + S vendor
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone -b Orange-Fox --depth 1 https://github.com/ngduyd/device_xiaomi_selene.git device/xiaomi/selene
        git clone -b lineage-20 --depth 1 https://github.com/selene-devs/android_vendor_xiaomi_selene.git vendor/xiaomi/selene
        echo "COMMIT_ID=$(git -C device/xiaomi/selene rev-parse HEAD)" >> $GITHUB_ENV

    - name: Build OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        df -h | tail -3
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=selene
        export LC_ALL=C
        ccache -z
        source build/envsetup.sh
        lunch omni_selene-eng
        mka bootimage 2>&1 | tee build.log

    - name: ccache stats
      if: always()
      run: ccache -s

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        path: OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build.log
        retention-days: 14

    - name: Find output image
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        IMG=$(ls out/target/product/selene/OrangeFox*.img 2>/dev/null | head -1)
        [ -z "$IMG" ] && IMG=$(ls out/target/product/selene/boot.img 2>/dev/null | head -1)
        if [ -n "$IMG" ]; then
          echo "IMG_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/selene/$(basename $IMG)" >> $GITHUB_ENV
          echo "FOUND: $IMG"
        else
          echo "no image found"; ls -la out/target/product/selene/ | head -30
        fi

    - name: Upload recovery image
      if: env.IMG_PATH != ''
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-selene-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        path: ${{ env.IMG_PATH }}

    - name: Release
      if: env.IMG_PATH != ''
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.IMG_PATH }}
        name: OrangeFox selene ${{ github.event.inputs.MANIFEST_BRANCH }} // ${{ github.run_number }}
        tag_name: ofox-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        body: |
          Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Target: recoveryimage
          Device tree: ngduyd/device_xiaomi_selene (Orange-Fox) commit ${{ env.COMMIT_ID }}
          Vendor: selene-devs/android_vendor_xiaomi_selene (lineage-20)